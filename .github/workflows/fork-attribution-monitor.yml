name: Fork attribution monitor

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fork-attribution-monitor
  cancel-in-progress: true

jobs:
  inspect-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out monitor
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Inspect attribution and fork changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-forks.mjs
